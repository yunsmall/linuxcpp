[module]
name = "etl_kv"
description = "ETL based in-memory key-value misc device"
license = "GPL"

[device]
name = "etl_kv"
mode = "0666"

[bindings]
roots = ["file", "file_operations", "kiocb", "iov_iter", "miscdevice"]
extern = ["misc_register", "misc_deregister", "compat_ptr_ioctl"]
thunk = ["copy_to_iter", "copy_from_iter", "copy_from_user", "copy_to_user"]

[build]
cxx_includes = ["../../linuxcpp/third_party/etl/include", "../../linuxcpp/third_party/etl/shim"]
cxx_flags = ["-DETL_NO_STL", "-DETL_NO_STD_MUTEX"]
